name: Supabase Migration Dry Run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migration-dry-run.yml'

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_REF:-}" || { echo 'Missing repository variable: SUPABASE_PROJECT_REF'; exit 1; }
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing repository secret: SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo 'Missing repository secret: SUPABASE_DB_PASSWORD'; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration status
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked

      - name: Dry-run remote migration push
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run

      - name: Checkpoint
        shell: bash
        run: |
          echo 'PASS: Supabase migration dry-run completed without applying remote schema changes.'
