name: Slice B Runtime Checkpoint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/slice-b-runtime-checkpoint.yml'

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
  SLICE_B_SESSION_ID: '4e690585-4986-48d9-a6cb-1a0d168fd06f'

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect Slice B production state
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --linked "
          select jsonb_pretty(
            jsonb_build_object(
              'session', (
                select to_jsonb(s)
                from (
                  select
                    id,
                    title,
                    status,
                    interest_opens_at,
                    interest_closes_at,
                    draw_starts_at,
                    wave_size,
                    wave_interval_minutes,
                    max_waves,
                    now() as db_now
                  from public.booking_sessions
                  where id = '$SLICE_B_SESSION_ID'::uuid
                ) s
              ),
              'interests', (
                select to_jsonb(i)
                from (
                  select
                    count(*) as total,
                    count(*) filter (where status = 'active') as active,
                    count(*) filter (where status = 'selected') as selected,
                    count(*) filter (where status = 'cancelled') as cancelled,
                    count(*) filter (where status = 'closed') as closed,
                    min(joined_at) as first_joined_at,
                    max(selected_at) as last_selected_at
                  from public.interests
                  where session_id = '$SLICE_B_SESSION_ID'::uuid
                ) i
              ),
              'waves', coalesce((
                select jsonb_agg(
                  jsonb_build_object(
                    'wave_no', wave_no,
                    'scheduled_at', scheduled_at,
                    'processed_at', processed_at,
                    'status', status,
                    'selected_count', selected_count,
                    'error_message', error_message
                  ) order by wave_no
                )
                from public.draw_waves
                where session_id = '$SLICE_B_SESSION_ID'::uuid
              ), '[]'::jsonb),
              'invitations', (
                select to_jsonb(inv)
                from (
                  select
                    count(*) as total,
                    min(issued_at) as first_issued_at,
                    max(issued_at) as last_issued_at
                  from public.invitations
                  where session_id = '$SLICE_B_SESSION_ID'::uuid
                ) inv
              )
            )
          ) as runtime_state;
          "
