name: Slice E Admin Runtime Checkpoint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/slice-e-admin-runtime-checkpoint.yml'
      - 'supabase/migrations/20260905001300_bootstrap_single_operator_admin.sql'

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect Slice E admin bootstrap state
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --linked "
          select jsonb_pretty(
            jsonb_build_object(
              'db_now', now(),
              'auth_user_count', (select count(*) from auth.users),
              'platform_admin_count', (select count(*) from public.platform_admins),
              'golden_path_user_count', (
                select count(distinct i.user_id)
                from public.interests i
                where i.session_id = 'f0cc7c5e-5812-47c9-a405-aed71cb4eb73'::uuid
              ),
              'golden_path_user_is_admin', (
                select exists (
                  select 1
                  from public.interests i
                  join public.platform_admins a on a.user_id = i.user_id
                  where i.session_id = 'f0cc7c5e-5812-47c9-a405-aed71cb4eb73'::uuid
                )
              ),
              'admin_surface_objects', jsonb_build_object(
                'platform_admins_table', to_regclass('public.platform_admins') is not null,
                'is_platform_admin_rpc', to_regprocedure('public.is_platform_admin()') is not null,
                'admin_create_session_rpc', to_regprocedure('public.admin_create_session(text,timestamp with time zone,timestamp with time zone,timestamp with time zone,timestamp with time zone,integer,integer,integer,integer,integer,integer,integer,text)') is not null,
                'admin_publish_session_rpc', to_regprocedure('public.admin_publish_session(uuid)') is not null,
                'admin_list_sessions_rpc', to_regprocedure('public.admin_list_sessions()') is not null
              )
            )
          ) as runtime_state;
          "
